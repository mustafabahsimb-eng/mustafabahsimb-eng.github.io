<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hear Them Again</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  [hidden]{display:none!important}
  :root{--bg:#F4EEE3;--fg:#2B2A28;--muted:#7a746b;--card:#fff;--line:#e3dccf;--accent:#2B2A28}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg)}
  .wrap{max-width:560px;margin:0 auto;padding:32px 20px 60px}
  h1{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500;font-size:44px;margin:0 0 6px;text-align:center}
  .sub{text-align:center;color:var(--muted);margin:0 0 28px;font-size:15px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
  label{display:block;font-weight:600;font-size:14px;margin:0 0 8px}
  input[type=text]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;margin-bottom:16px;background:#fff}
  input[type=file]{width:100%;font-size:15px;margin-bottom:6px}
  .hint{font-size:13px;color:var(--muted);margin:0 0 16px}
  .themes{display:flex;gap:10px;margin-bottom:6px}
  .theme{flex:1;border:2px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;cursor:pointer;font-size:13px;font-weight:600}
  .theme.on{border-color:var(--accent)}
  .sw{display:block;height:34px;border-radius:8px;margin-bottom:8px}
  button.main{width:100%;padding:16px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-size:17px;font-weight:600;cursor:pointer}
  button.main:disabled{opacity:.5;cursor:default}
  #status{text-align:center;font-size:14px;color:var(--muted);min-height:20px;margin:12px 0}
  #status.err{color:#b3261e}
  #result{display:none}
  #preview{width:100%;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.12);display:block;margin-bottom:16px}
  .dl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .dl button{padding:13px;border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
  .dl button.all{grid-column:1/-1;background:var(--accent);color:#fff}
  #player{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#15171C;color:#E9DCC0}
  #player .box{width:100%;max-width:520px;padding:30px 22px;text-align:center}
  #player h1{color:#E9DCC0;font-size:40px}
  #pwave{width:100%;height:140px;display:block;margin:26px 0}
  #play{width:84px;height:84px;border-radius:50%;border:0;background:#C9A45C;color:#15171C;font-size:30px;cursor:pointer}
  #ptime{margin-top:14px;font-size:14px;opacity:.7}
  #perr{color:#f2b8b5;font-size:14px;margin-top:14px}
</style>
</head>
<body>

<div id="maker" hidden>
  <div class="wrap">
    <h1>Hear Them Again</h1>
    <p class="sub">Upload a recording and your print is ready in seconds.</p>

    <div class="card">
      <label for="file">1. Your recording</label>
      <input type="file" id="file" accept="audio/*,video/*,.m4a,.opus,.ogg,.mp3,.wav,.aac">
      <p class="hint">Voice memo, WhatsApp voice note, MP3, M4A, WAV. Up to 10 minutes.</p>

      <label for="name">2. Name or title</label>
      <input type="text" id="name" maxlength="40" placeholder="e.g. Mom">

      <label for="line2">Small line (optional)</label>
      <input type="text" id="line2" maxlength="60" placeholder="e.g. Always with us · 1958 – 2024">

      <label>3. Colour style</label>
      <div class="themes" id="themes"></div>
    </div>

    <button class="main" id="go">Create my print</button>
    <div id="status"></div>

    <div class="card" id="result">
      <img id="preview" alt="Your print preview">
      <div class="dl">
        <button data-size="A4">A4</button>
        <button data-size="A3">A3</button>
        <button data-size="8x10">8x10 in</button>
        <button data-size="11x14">11x14 in</button>
        <button class="all" id="all">Download all sizes</button>
      </div>
      <p class="hint" style="margin:14px 0 0">Scan the QR code on the preview with your phone to test it.</p>
    </div>
  </div>
</div>

<div id="player" hidden>
  <div class="box">
    <h1>Hear Them Again</h1>
    <canvas id="pwave"></canvas>
    <button id="play" aria-label="Play">▶</button>
    <div id="ptime">0:00</div>
    <div id="perr"></div>
  </div>
</div>

<script>
const CLOUD = 'biqw7hzi';
const PRESET = 'hear_them_again';
const BASE = location.origin + location.pathname;
const MAX_SEC = 600, MAX_MB = 100, BARS = 180;

const THEMES = {
  cream:    {label:'Cream',         bg:'#F4EEE3', fg:'#2B2A28', wave:'#2B2A28', tile:'#FFFFFF'},
  midnight: {label:'Midnight Gold', bg:'#15171C', fg:'#E9DCC0', wave:'#C9A45C', tile:'#F4EEE3'},
  sage:     {label:'Sage',          bg:'#DCE3D6', fg:'#2F3A2E', wave:'#3F5240', tile:'#F6F7F2'}
};
const SIZES = {
  'A4':   [2480, 3508],
  'A3':   [3508, 4961],
  '8x10': [2400, 3000],
  '11x14':[3300, 4200]
};

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
let theme = 'cream', peaks = null, link = null, nameTxt = '', line2Txt = '';

function audioCtx(){ return new (window.AudioContext || window.webkitAudioContext)(); }
function decode(buf){
  const ctx = audioCtx();
  return new Promise((res, rej) => ctx.decodeAudioData(buf, res, rej));
}
function peaksOf(audio, n){
  const d = audio.getChannelData(0), step = Math.floor(d.length / n) || 1, out = [];
  for (let i = 0; i < n; i++){
    let m = 0;
    for (let j = i * step, e = Math.min(d.length, j + step); j < e; j += 4){ const v = Math.abs(d[j]); if (v > m) m = v; }
    out.push(m);
  }
  const max = Math.max(...out) || 1;
  return out.map(v => Math.max(0.04, Math.sqrt(v / max)));
}
function mp3Url(id){ return 'https://res.cloudinary.com/' + CLOUD + '/video/upload/' + id + '.mp3'; }
function fmt(s){ s = Math.floor(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

function startMaker(){
  $('maker').hidden = false;
  const box = $('themes');
  Object.entries(THEMES).forEach(([k, t]) => {
    const d = document.createElement('div');
    d.className = 'theme' + (k === theme ? ' on' : '');
    d.innerHTML = '<span class="sw" style="background:' + t.bg + ';border:1px solid #ddd"></span>' + t.label;
    d.onclick = () => {
      theme = k;
      [...box.children].forEach(c => c.classList.remove('on'));
      d.classList.add('on');
      if (peaks) showPreview();
    };
    box.appendChild(d);
  });
  $('go').onclick = create;
  document.querySelectorAll('.dl button[data-size]').forEach(b => b.onclick = () => download(b.dataset.size));
  $('all').onclick = async () => { for (const s of Object.keys(SIZES)){ await download(s); await new Promise(r => setTimeout(r, 700)); } };
}

function status(msg, err){ const s = $('status'); s.textContent = msg; s.className = err ? 'err' : ''; }

async function create(){
  const f = $('file').files[0];
  nameTxt = $('name').value.trim();
  line2Txt = $('line2').value.trim();
  if (!f) return status('Please choose your recording first.', true);
  if (f.size > MAX_MB * 1024 * 1024) return status('This file is too large (max ' + MAX_MB + ' MB).', true);
  $('go').disabled = true;
  try {
    status('Reading your recording…');
    let audio = null;
    try { audio = await decode(await f.arrayBuffer()); } catch(e) { audio = null; }
    if (audio && audio.duration > MAX_SEC) throw new Error('Recording is longer than 10 minutes. Please trim it and try again.');

    status('Saving your recording securely…');
    const fd = new FormData();
    fd.append('file', f);
    fd.append('upload_preset', PRESET);
    const r = await fetch('https://api.cloudinary.com/v1_1/' + CLOUD + '/auto/upload', {method:'POST', body:fd});
    const j = await r.json();
    if (!r.ok || !j.public_id) throw new Error((j.error && j.error.message) || 'Upload failed. Please try again.');
    link = BASE + '?a=' + encodeURIComponent(j.public_id);

    if (!audio){
      status('Preparing your sound wave…');
      const m = await fetch(mp3Url(j.public_id));
      audio = await decode(await m.arrayBuffer());
      if (audio.duration > MAX_SEC) throw new Error('Recording is longer than 10 minutes. Please trim it and try again.');
    }
    peaks = peaksOf(audio, BARS);
    await document.fonts.load('italic 500 80px "Cormorant Garamond"');
    await document.fonts.load('400 40px Inter');
    showPreview();
    $('result').style.display = 'block';
    status('Your print is ready. Download your sizes below.');
    $('result').scrollIntoView({behavior:'smooth'});
  } catch(e) {
    status(e.message || 'Something went wrong. Please try again.', true);
  } finally {
    $('go').disabled = false;
  }
}

function showPreview(){ $('preview').src = render(800, 1131).toDataURL('image/jpeg', 0.9); }

function download(size){
  return new Promise(res => {
    const [w, h] = SIZES[size];
    render(w, h).toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'hear-them-again-' + size + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      res();
    }, 'image/png');
  });
}

function render(w, h){
  const t = THEMES[theme], c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.fillStyle = t.bg; x.fillRect(0, 0, w, h);
  x.textAlign = 'center'; x.textBaseline = 'alphabetic';

  if (nameTxt){
    let fs = w * 0.085;
    x.font = 'italic 500 ' + fs + 'px "Cormorant Garamond", Georgia, serif';
    while (x.measureText(nameTxt).width > w * 0.84 && fs > 20){ fs -= 2; x.font = 'italic 500 ' + fs + 'px "Cormorant Garamond", Georgia, serif'; }
    x.fillStyle = t.fg; x.fillText(nameTxt, w / 2, h * 0.21);
  }
  if (line2Txt){
    x.font = '400 ' + (w * 0.022) + 'px Inter, Arial, sans-serif';
    x.fillStyle = t.fg; x.globalAlpha = 0.75;
    x.fillText(line2Txt.toUpperCase().split('').join(String.fromCharCode(8202)), w / 2, h * 0.265);
    x.globalAlpha = 1;
  }

  const m = w * 0.09, area = w - 2 * m, cy = h * 0.46, amp = h * 0.11;
  const slot = area / peaks.length, bw = slot * 0.55;
  x.strokeStyle = t.wave; x.lineWidth = bw; x.lineCap = 'round';
  peaks.forEach((p, i) => {
    const px = m + slot * i + slot / 2, half = Math.max(bw / 2, p * amp);
    x.beginPath(); x.moveTo(px, cy - half); x.lineTo(px, cy + half); x.stroke();
  });

  const q = qrcode(0, 'M'); q.addData(link); q.make();
  const n = q.getModuleCount(), qs = w * 0.19, pad = qs * 0.1, cell = qs / n;
  const qx = (w - qs) / 2, qy = h * 0.64, tile = qs + pad * 2;
  x.fillStyle = t.tile;
  roundRect(x, qx - pad, qy - pad, tile, tile, tile * 0.08); x.fill();
  x.fillStyle = '#1b1b1b';
  for (let r = 0; r < n; r++) for (let col = 0; col < n; col++)
    if (q.isDark(r, col)) x.fillRect(Math.floor(qx + col * cell), Math.floor(qy + r * cell), Math.ceil(cell), Math.ceil(cell));

  x.fillStyle = t.fg; x.globalAlpha = 0.8;
  x.font = '400 ' + (w * 0.018) + 'px Inter, Arial, sans-serif';
  x.fillText('SCAN TO HEAR'.split('').join(String.fromCharCode(8202)), w / 2, qy + qs + pad + w * 0.04);
  x.globalAlpha = 1;
  return c;
}

function roundRect(x, a, b, w, h, r){
  x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r);
  x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath();
}

function startPlayer(id){
  $('player').hidden = false;
  const audio = new Audio(mp3Url(id));
  audio.preload = 'auto';
  const cv = $('pwave'), btn = $('play');
  let pk = null;

  function draw(){
    const r = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * r; cv.height = H * r;
    const x = cv.getContext('2d'); x.scale(r, r);
    if (!pk) return;
    const slot = W / pk.length, bw = Math.max(1.5, slot * 0.55), prog = audio.duration ? audio.currentTime / audio.duration : 0;
    x.lineCap = 'round'; x.lineWidth = bw;
    pk.forEach((p, i) => {
      const px = slot * i + slot / 2, half = Math.max(bw / 2, p * H * 0.45);
      x.strokeStyle = (i / pk.length) <= prog ? '#C9A45C' : 'rgba(233,220,192,.35)';
      x.beginPath(); x.moveTo(px, H / 2 - half); x.lineTo(px, H / 2 + half); x.stroke();
    });
  }
  function loop(){ draw(); $('ptime').textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration); if (!audio.paused) requestAnimationFrame(loop); }

  fetch(mp3Url(id)).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
    .then(decode).then(a => { pk = peaksOf(a, 120); draw(); })
    .catch(() => { $('perr').textContent = 'This recording could not be found.'; btn.disabled = true; });

  btn.onclick = () => {
    if (audio.paused){ audio.play(); btn.textContent = '❚❚'; loop(); }
    else { audio.pause(); btn.textContent = '▶'; }
  };
  audio.onended = () => { btn.textContent = '▶'; draw(); };
  audio.onloadedmetadata = () => $('ptime').textContent = '0:00 / ' + fmt(audio.duration);
  window.addEventListener('resize', draw);
}

if (params.get('a')) startPlayer(params.get('a')); else startMaker();
</script>
</body>
</html>
